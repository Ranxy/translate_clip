name: Build Windows Package

on:
  workflow_dispatch:
  # Publishing a GitHub Release is the release pipeline: it builds the tagged
  # commit and attaches the installer to that same release. A plain `git push
  # --tags` does not trigger anything — releasing is what ships.
  release:
    types:
      - published
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  windows-dist:
    runs-on: windows-latest
    permissions:
      # Needed by the release path only (attach assets to the release). The token
      # is exposed to that single step, never to the build/test steps.
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure the Electron binary is present
        run: node node_modules/electron/install.js

      - name: Type check
        run: npm run typecheck

      - name: i18n audit
        run: npm run i18n:check

      - name: Unit tests
        run: npm run test

      - name: End-to-end self-check
        # Hosted runners do not always expose a desktop session, which the GUI
        # checks need. Type check, unit tests and the installer build stay hard
        # gates; this step is extra signal, not a gate.
        continue-on-error: true
        run: npm run self-check

      - name: Verify the release tag matches the packaged version
        # electron-builder uploads to `v` + package.json version, so a release
        # tagged differently would publish the installer to the wrong release.
        # Runs before the build; the tag is read from GITHUB_REF_NAME.
        if: github.event_name == 'release'
        run: node scripts/check-release-tag.mjs

      - name: Build the installer
        if: github.event_name != 'release'
        run: npm run dist:win

      - name: Build the installer and attach it to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Re-running a failed release job must overwrite the assets even when
          # the release is older than electron-builder's 2 hour upload window.
          EP_GH_IGNORE_TIME: 'true'
        run: npm run release:win

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: translate-clip-windows
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: error
