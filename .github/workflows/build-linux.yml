name: Build Linux Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  linux-dist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: i18n audit
        run: npm run i18n:check

      - name: Unit tests
        run: npm run test

      - name: End-to-end self-check
        # Needs a display; xvfb provides one so the GUI checks really run here.
        # Unlike the Windows job this is a hard gate, because a virtual display makes
        # the GUI path deterministic. If a runner image ever lacks the Electron
        # runtime libraries, relax this step the same way build-windows.yml does.
        run: xvfb-run --auto-servernum npm run self-check

      - name: Build AppImage and deb
        run: npm run dist:linux

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: translate-clip-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
