name: Build Linux Package

on:
  workflow_dispatch:
  # Publishing a GitHub Release is the release pipeline: it builds the tagged
  # commit and attaches the packages to that same release. A plain `git push
  # --tags` does not trigger anything — releasing is what ships.
  release:
    types:
      - published
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  linux-dist:
    runs-on: ubuntu-latest
    permissions:
      # Needed by the release path only (attach assets to the release). The token
      # is exposed to that single step, never to the build/test steps.
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: i18n audit
        run: npm run i18n:check

      - name: Unit tests
        run: npm run test

      - name: End-to-end self-check
        # Needs a display; xvfb provides one so the GUI checks really run here.
        # Unlike the Windows job this is a hard gate, because a virtual display makes
        # the GUI path deterministic. If a runner image ever lacks the Electron
        # runtime libraries, relax this step the same way build-windows.yml does.
        run: xvfb-run --auto-servernum npm run self-check

      - name: Verify the release tag matches the packaged version
        # electron-builder uploads to `v` + package.json version, so a release
        # tagged differently would publish the packages to the wrong release.
        # Runs before the build; the tag is read from GITHUB_REF_NAME.
        if: github.event_name == 'release'
        run: node scripts/check-release-tag.mjs

      - name: Build AppImage and deb
        if: github.event_name != 'release'
        run: npm run dist:linux

      - name: Build AppImage and deb, and attach them to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Re-running a failed release job must overwrite the assets even when
          # the release is older than electron-builder's 2 hour upload window.
          EP_GH_IGNORE_TIME: 'true'
        run: npm run release:linux

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: translate-clip-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
