appId: com.ranxy.translateclip
productName: TranslateClip
directories:
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  # Mapped per directory so the packaged layout matches resolveResourcePath():
  # <resources>/icons/... and <resources>/tray/...
  - from: resources/icons
    to: icons
  - from: resources/tray
    to: tray
asar: true
asarUnpack:
  - "**/node_modules/sql.js/dist/*.wasm"
artifactName: ${productName}-${version}-${arch}.${ext}
# Publishing only ever happens through .github/workflows (on a published GitHub
# Release), which calls `npm run release:win` / `release:linux` — i.e. `--publish
# always`. Every other build passes `--publish never`, so this block stays inert
# locally and in PR/main builds. It exists to pin two defaults:
#   - releaseType: release — electron-builder defaults to *draft*, and a draft
#     publisher refuses to upload to a release that is already public ("GitHub
#     release not created"), which is exactly the release we are building for.
#   - vPrefixedTagName: true — releases are tagged `v<package.json version>`;
#     scripts/check-release-tag.mjs enforces that before anything is built.
publish:
  - provider: github
    releaseType: release
    vPrefixedTagName: true
win:
  target:
    - target: nsis
      arch:
        - x64
  # electron-builder converts this PNG to a multi-size ICO on the Windows side
  # (getOrConvertIcon('ico') accepts .png). Shipping our own hand-rolled .ico was
  # worse: ICO cannot be decoded by nativeImage on Linux, so the file could not be
  # verified anywhere except on Windows.
  icon: resources/icons/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: TranslateClip
linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: resources/icons
  maintainer: Ranxy
